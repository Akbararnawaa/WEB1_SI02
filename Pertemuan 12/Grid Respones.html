<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Grid Responsif</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
        }
        .grid > div {
            background: rgb(122, 3, 21);
            padding: 20px;
        }  
        @media (max-width: 600px) {
            .grid > div {
                grid-column: span 12;
            }
        }
        @media (min-width: 601px) and (max-width: 992px) {
            .item-large {
                grid-column: span 12;
            }
            .item-medium {
                grid-column: span 6;
            }
        }
        @media (min-width: 993px) {
            .item-large {
                grid-column: span 12;
            }
            .item-medium {
                grid-column: span 6;
            }
            .item-small {
                grid-column: span 3;
            }   
        }
    </style>
</head>
<body>
    <h1>Grid Responsif</h1>
    <div class="grid">
        <div class="box1">box 1</div>
        <div class="box2">box 2</div>
        <div class="box3">box 3</div>
        
    </div>
</body>
</html>
